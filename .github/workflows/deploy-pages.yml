name: GitHub Pages yayınlama

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Pages yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Yayın varlıklarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: GitHub Pages’e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
